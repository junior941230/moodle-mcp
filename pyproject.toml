[project]
name = "moodle-mcp"
version = "0.1.0"
description = "Read-only MCP server for Moodle (Mobile Web Service API)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "moodle-mcp contributors" }]
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "markdownify>=0.12",
    "diskcache>=5.6",
    "platformdirs>=4.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "tzdata>=2024.1",
    "truststore>=0.10",
]

[project.scripts]
moodle-mcp = "moodle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
